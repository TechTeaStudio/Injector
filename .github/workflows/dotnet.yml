name: .NET

on:
  push:
    branches: ["product"]
  pull_request:
    branches: ["product"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Injector.slnx

      - name: Build
        run: dotnet build Injector.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Injector.slnx --no-build --configuration Release --verbosity normal
